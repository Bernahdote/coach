<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pacecraft — Träningsdashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #080808;
      --surface:  #101010;
      --surface2: #161616;
      --border:   #1f1f1f;
      --border2:  #2a2a2a;
      --text:     #f2f0ed;
      --muted:    #555555;
      --muted2:   #888888;
      --accent:   oklch(0.72 0.19 45);
      --accent-dim: color-mix(in srgb, oklch(0.72 0.19 45) 12%, transparent);
      --run:      oklch(0.72 0.19 45);
      --ride:     #3b82f6;
      --swim:     #06b6d4;
      --other:    #8b5cf6;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: "DM Sans", -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      position: fixed;
      inset: 0 0 auto;
      z-index: 50;
      padding: 1.25rem 1.5rem;
      transition: padding 0.3s;
    }

    header.scrolled { padding: 0.75rem 1.5rem; }

    .header-inner {
      max-width: 960px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 999px;
      padding: 0.6rem 1.25rem;
      transition: background 0.3s, backdrop-filter 0.3s, border-color 0.3s;
      border: 1px solid transparent;
    }

    header.scrolled .header-inner {
      background: color-mix(in srgb, var(--surface) 80%, transparent);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-color: var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      text-decoration: none;
      color: var(--text);
    }

    .logo-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 8px var(--accent);
    }

    .logo-name {
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }

    .header-tag {
      font-family: "DM Mono", monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
    }

    /* ── Main ── */
    main {
      max-width: 960px;
      margin: 0 auto;
      padding: 7rem 1.5rem 5rem;
    }

    .page-header {
      margin-bottom: 3rem;
    }

    .page-eyebrow {
      font-family: "DM Mono", monospace;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.2em;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .page-title {
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 1.1;
    }

    .page-sub {
      margin-top: 0.6rem;
      color: var(--muted2);
      font-size: 0.9rem;
      max-width: 440px;
    }

    /* ── Grid ── */
    #grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
      gap: 0.75rem;
    }

    /* ── Card ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.25rem;
      padding: 1.25rem 1.5rem 1.5rem;
      transition: border-color 0.2s, background 0.2s;
      cursor: default;
    }

    .card:hover {
      border-color: var(--border2);
      background: var(--surface2);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 1rem;
    }

    .card-eyebrow {
      font-family: "DM Mono", monospace;
      font-size: 0.62rem;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      color: var(--muted);
      margin-bottom: 0.35rem;
    }

    .card-name {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.025em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 260px;
    }

    .badge {
      flex-shrink: 0;
      font-family: "DM Mono", monospace;
      font-size: 0.65rem;
      font-weight: 500;
      padding: 0.3rem 0.75rem;
      border-radius: 999px;
    }

    .badge-Run   { background: var(--accent-dim); color: var(--accent); }
    .badge-Ride  { background: color-mix(in srgb, #3b82f6 12%, transparent); color: #3b82f6; }
    .badge-Swim  { background: color-mix(in srgb, #06b6d4 12%, transparent); color: #06b6d4; }
    .badge-Other { background: color-mix(in srgb, #8b5cf6 12%, transparent); color: #8b5cf6; }

    .divider {
      height: 1px;
      background: var(--border);
      margin: 1.1rem 0;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
    }

    .stat-label {
      font-family: "DM Mono", monospace;
      font-size: 0.6rem;
      text-transform: uppercase;
      letter-spacing: 0.14em;
      color: var(--muted);
      margin-bottom: 0.3rem;
    }

    .stat-value {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      font-variant-numeric: tabular-nums;
      line-height: 1;
    }

    .stat-unit {
      font-size: 0.6rem;
      font-family: "DM Mono", monospace;
      color: var(--muted);
      margin-left: 0.15rem;
    }

    /* ── Skeleton ── */
    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--surface2) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.5s infinite;
      border-radius: 1.25rem;
      height: 148px;
      border: 1px solid var(--border);
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    /* ── Error ── */
    .error {
      padding: 1rem 1.25rem;
      background: color-mix(in srgb, #ef4444 8%, transparent);
      border: 1px solid color-mix(in srgb, #ef4444 25%, transparent);
      border-radius: 0.75rem;
      color: #f87171;
      font-size: 0.875rem;
    }
  </style>
</head>
<body>
  <header id="header">
    <div class="header-inner">
      <a class="logo" href="/">
        <span class="logo-dot"></span>
        <span class="logo-name">Pacecraft</span>
      </a>
      <span class="header-tag">Träningsdashboard</span>
    </div>
  </header>

  <main>
    <div class="page-header">
      <p class="page-eyebrow">Live · Strava</p>
      <h1 class="page-title">Senaste passen</h1>
      <p class="page-sub">Träningsdata hämtad direkt från Strava.</p>
    </div>

    <div id="grid"></div>
  </main>

  <script>
    // Sticky header glass effect
    const header = document.getElementById("header");
    window.addEventListener("scroll", () => {
      header.classList.toggle("scrolled", window.scrollY > 20);
    }, { passive: true });

    const API = "/api/activities?user=a&per_page=30";
    const grid = document.getElementById("grid");

    function formatDuration(s) {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
      return `${m}:${String(sec).padStart(2,"0")}`;
    }

    function formatPace(mps) {
      if (!mps) return "—";
      const spk = 1000 / mps;
      const m = Math.floor(spk / 60);
      const s = Math.round(spk % 60);
      return `${m}:${String(s).padStart(2,"0")}`;
    }

    function badgeClass(type) {
      if (!type) return "badge-Other";
      if (type.includes("Run"))  return "badge-Run";
      if (type.includes("Ride")) return "badge-Ride";
      if (type === "Swim")       return "badge-Swim";
      return "badge-Other";
    }

    function renderCard(a) {
      const km = (a.distance / 1000).toFixed(2);
      const date = new Date(a.start_date_local);
      const dateStr = date.toLocaleDateString("sv-SE", { weekday:"short", day:"numeric", month:"short" });
      const isRun = a.sport_type?.includes("Run");

      return `
        <div class="card">
          <div class="card-top">
            <div style="min-width:0">
              <div class="card-eyebrow">${a.sport_type ?? "Aktivitet"} · ${dateStr}</div>
              <div class="card-name">${a.name}</div>
            </div>
            <span class="badge ${badgeClass(a.sport_type)}">${km} km</span>
          </div>
          <div class="divider"></div>
          <div class="stats">
            <div>
              <div class="stat-label">Tid</div>
              <div class="stat-value">${formatDuration(a.moving_time)}</div>
            </div>
            <div>
              <div class="stat-label">${isRun ? "Tempo" : "Fart"}</div>
              <div class="stat-value">
                ${isRun ? formatPace(a.average_speed) : (a.average_speed * 3.6).toFixed(1)}
                <span class="stat-unit">${isRun ? "/km" : "km/h"}</span>
              </div>
            </div>
            <div>
              <div class="stat-label">Puls</div>
              <div class="stat-value">
                ${a.average_heartrate ? Math.round(a.average_heartrate) : "—"}
                <span class="stat-unit">${a.average_heartrate ? "bpm" : ""}</span>
              </div>
            </div>
            <div>
              <div class="stat-label">Höjd</div>
              <div class="stat-value">
                ${Math.round(a.total_elevation_gain)}<span class="stat-unit">m</span>
              </div>
            </div>
          </div>
        </div>`;
    }

    grid.innerHTML = Array.from({length: 6}, () => `<div class="skeleton"></div>`).join("");

    fetch(API)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(activities => {
        if (!activities.length) {
          grid.innerHTML = `<p style="color:var(--muted)">Inga aktiviteter hittades.</p>`;
          return;
        }
        grid.innerHTML = activities.map(renderCard).join("");
      })
      .catch(err => {
        grid.innerHTML = `<div class="error">Kunde inte hämta aktiviteter: ${err.message}</div>`;
      });
  </script>
</body>
</html>
