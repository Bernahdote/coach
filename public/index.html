<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pacecraft</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;0,900&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <script>
    const pwd = sessionStorage.getItem("auth");
    if (pwd !== "pacecraft") {
      const v = prompt("Password:");
      if (v !== "pacecraft") { document.write("<body style='background:#fff;font-family:sans-serif;display:flex;align-items:center;justify-content:center;height:100vh'>Access denied.</body>"); throw 0; }
      sessionStorage.setItem("auth", v);
    }
  </script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #f7f5f0;
      --white:   #ffffff;
      --s2:      #f0ede8;
      --border:  #e2ddd8;
      --border2: #ccc8c2;
      --text:    #1a1714;
      --text2:   #6b6560;
      --muted:   #a8a29c;
      --orange:  #ff5500;
      --cyan:    #0088cc;
      --purple:  #7c3aed;
      --green:   #16a34a;
      --hdr:     60px;
      --z1:#0088cc;--z2:#16a34a;--z3:#eab308;--z4:#ff5500;--z5:#dc2626;
    }
    html { scroll-behavior: smooth; }
    body { background: var(--bg); color: var(--text); font-family: "DM Sans", system-ui, sans-serif; min-height: 100vh; overflow-x: hidden; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }

    /* ── HEADER ── */
    .hdr {
      position: fixed; inset: 0 0 auto; z-index: 100; height: var(--hdr);
      background: rgba(247,245,240,0.95); backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center;
    }
    .hdr.raised { box-shadow: 0 2px 20px rgba(0,0,0,0.07); }
    .hdr-inner { width: 100%; display: flex; align-items: center; padding: 0 1.5rem; gap: 1rem; }
    .logo { display: flex; align-items: center; gap: 0.65rem; text-decoration: none; color: var(--text); flex-shrink: 0; }
    .logo-icon { position: relative; width: 28px; height: 28px; }
    .logo-ring { width: 28px; height: 28px; border-radius: 50%; border: 2px solid var(--border2); animation: spin 8s linear infinite; }
    .logo-sat { position: absolute; top: -3px; left: 50%; transform: translateX(-50%); width: 7px; height: 7px; border-radius: 50%; background: var(--orange); box-shadow: 0 0 10px var(--orange); }
    .logo-core { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); width: 4px; height: 4px; border-radius: 50%; background: var(--text2); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo-name { font-size: 0.95rem; font-weight: 800; letter-spacing: -0.03em; }

    /* User switcher */
    .user-switch { display: flex; align-items: center; background: var(--s2); border: 1px solid var(--border); border-radius: 999px; padding: 0.2rem; gap: 0.1rem; flex-shrink: 0; }
    .user-btn { padding: 0.3rem 0.875rem; border-radius: 999px; font-size: 0.8rem; font-weight: 600; cursor: pointer; border: none; background: none; color: var(--text2); transition: background 0.15s, color 0.15s; letter-spacing: -0.01em; }
    .user-btn.on { background: var(--white); color: var(--text); box-shadow: 0 1px 4px rgba(0,0,0,0.08); }

    /* Nav tabs */
    .nav { display: flex; align-items: center; gap: 0.25rem; margin-left: 1.5rem; }
    .nav-tab { padding: 0.4rem 1rem; border-radius: 999px; font-size: 0.875rem; font-weight: 500; cursor: pointer; border: none; background: none; color: var(--text2); transition: background 0.15s, color 0.15s; }
    .nav-tab:hover { background: var(--s2); color: var(--text); }
    .nav-tab.on { background: var(--text); color: #fff; }

    /* Header right */
    .hdr-space { flex: 1; }
    .hdr-stats { display: flex; align-items: center; gap: 1.5rem; }
    .hdr-stat-val { font-size: 0.9rem; font-weight: 700; letter-spacing: -0.02em; }
    .hdr-stat-lbl { font-family: "DM Mono", monospace; font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); }
    .hdr-sep { width: 1px; height: 24px; background: var(--border); }
    .hdr-avatar { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, var(--orange), var(--purple)); display: flex; align-items: center; justify-content: center; font-size: 0.62rem; font-weight: 800; color: #fff; cursor: default; flex-shrink: 0; }
    .settings-btn { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: var(--white); cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: var(--text2); transition: border-color 0.2s, color 0.2s; flex-shrink: 0; }
    .settings-btn:hover { border-color: var(--border2); color: var(--text); }

    /* ── PAGES ── */
    .page { display: none; padding-top: var(--hdr); min-height: 100vh; }
    .page.on { display: block; }

    /* ── LATEST ACTIVITY HERO ── */
    .latest-hero { padding: 2rem 2rem 0; max-width: 1400px; margin: 0 auto; }
    .latest-label { font-family: "DM Mono", monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.2em; color: var(--muted); margin-bottom: 0.75rem; }
    .latest-card {
      background: var(--text); border-radius: 1.5rem; overflow: hidden;
      display: grid; grid-template-columns: 1fr auto; min-height: 200px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.12);
    }
    .latest-body { padding: 2rem 2.5rem; display: flex; flex-direction: column; justify-content: space-between; }
    .latest-type { font-family: "DM Mono", monospace; font-size: 0.62rem; text-transform: uppercase; letter-spacing: 0.14em; color: rgba(255,255,255,0.35); margin-bottom: 0.5rem; }
    .latest-name { font-size: clamp(1.5rem, 3vw, 2.5rem); font-weight: 900; letter-spacing: -0.04em; color: #fff; line-height: 1.1; margin-bottom: 1.5rem; }
    .latest-stats { display: flex; gap: 2.5rem; flex-wrap: wrap; }
    .lstat-val { font-size: 2rem; font-weight: 900; letter-spacing: -0.045em; color: #fff; line-height: 1; font-variant-numeric: tabular-nums; }
    .lstat-val.accent { color: var(--orange); }
    .lstat-unit { font-family: "DM Mono", monospace; font-size: 0.6rem; color: rgba(255,255,255,0.35); margin-left: 0.2rem; }
    .lstat-lbl { font-family: "DM Mono", monospace; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.12em; color: rgba(255,255,255,0.3); margin-top: 0.35rem; }
    .latest-map { width: 320px; background: #0e0c14; overflow: hidden; flex-shrink: 0; }
    .latest-map svg { width: 100%; height: 100%; }
    @media(max-width:640px){.latest-card{grid-template-columns:1fr}.latest-map{display:none}}

    /* ── CALENDAR PAGE ── */
    .cal-page { padding: 1.75rem 2rem 5rem; max-width: 1400px; margin: 0 auto; }

    .cal-nav { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; }
    .cal-month-label { font-size: 2rem; font-weight: 900; letter-spacing: -0.045em; }
    .cal-nav-btns { display: flex; gap: 0.5rem; }
    .cal-btn { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--border); background: var(--white); cursor: pointer; font-size: 1.2rem; color: var(--text2); display: flex; align-items: center; justify-content: center; transition: border-color 0.2s, color 0.2s; }
    .cal-btn:hover { border-color: var(--border2); color: var(--text); }

    .cal-weekdays { display: grid; grid-template-columns: repeat(7,1fr); gap: 0.5rem; margin-bottom: 0.5rem; }
    .cal-wd { font-family: "DM Mono", monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); text-align: center; padding: 0.625rem 0; }

    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 0.5rem; }

    .cal-day {
      min-height: 160px; border-radius: 1.1rem; border: 1px solid var(--border);
      background: var(--white); padding: 1rem; position: relative;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .cal-day.empty { background: transparent; border-color: transparent; }
    .cal-day.has-act { cursor: pointer; }
    .cal-day.has-act:hover { border-color: var(--border2); transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.07); }
    .cal-day.is-today { border-color: var(--orange); background: color-mix(in srgb,var(--orange) 3%,var(--white)); }
    .cal-day.selected { border-color: var(--orange); box-shadow: 0 0 0 3px color-mix(in srgb,var(--orange) 15%,transparent); }
    .cal-day-num { font-size: 1.1rem; font-weight: 700; letter-spacing: -0.025em; color: var(--text2); margin-bottom: 0.75rem; }
    .cal-day.is-today .cal-day-num { color: var(--orange); }
    .cal-day-acts { display: flex; flex-direction: column; gap: 0.4rem; }
    .cal-act-chip {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.8rem; font-weight: 600; letter-spacing: -0.01em;
      padding: 0.35rem 0.6rem; border-radius: 0.625rem;
      overflow: hidden;
    }
    .cal-act-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .cal-act-km { font-family: "DM Mono", monospace; font-size: 0.7rem; font-weight: 500; margin-left: auto; flex-shrink: 0; }

    /* Activity detail drawer */
    .detail-drawer {
      display: none; background: var(--white); border: 1px solid var(--border);
      border-radius: 1.25rem; padding: 0; overflow: hidden;
      margin-top: 0.5rem; margin-bottom: 0.5rem;
      grid-column: 1 / -1;
    }
    .detail-drawer.open { display: block; }
    .drawer-map { height: 220px; background: var(--s2); overflow: hidden; display: flex; align-items: center; justify-content: center; border-bottom: 1px solid var(--border); }
    .drawer-map svg { width: 100%; height: 100%; }
    .drawer-header { padding: 1.25rem 1.5rem; border-bottom: 1px solid var(--border); display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; }
    .drawer-title { font-size: 1.2rem; font-weight: 800; letter-spacing: -0.03em; }
    .drawer-meta { font-family: "DM Mono", monospace; font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); margin-top: 0.3rem; }
    .drawer-close { background: none; border: 1px solid var(--border); border-radius: 50%; width: 28px; height: 28px; cursor: pointer; color: var(--text2); font-size: 0.8rem; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .drawer-stats { display: grid; grid-template-columns: repeat(4,1fr); border-bottom: 1px solid var(--border); }
    .dstat { padding: 1rem 1.25rem; border-right: 1px solid var(--border); }
    .dstat:last-child { border-right: none; }
    .dstat-lbl { font-family: "DM Mono", monospace; font-size: 0.52rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); margin-bottom: 0.35rem; }
    .dstat-val { font-size: 1.3rem; font-weight: 900; letter-spacing: -0.035em; font-variant-numeric: tabular-nums; }
    .dstat-unit { font-family: "DM Mono", monospace; font-size: 0.55rem; color: var(--muted); margin-left: 0.1rem; }
    .drawer-body { display: grid; grid-template-columns: 1fr 1fr; }
    .dcol { padding: 1.1rem 1.25rem; }
    .dcol + .dcol { border-left: 1px solid var(--border); }
    .dlbl { font-family: "DM Mono", monospace; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.14em; color: var(--muted); margin-bottom: 0.65rem; }
    .zrow { display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.4rem; }
    .zname { font-family: "DM Mono", monospace; font-size: 0.58rem; color: var(--text2); width: 1.8rem; flex-shrink: 0; }
    .zbg { flex: 1; background: var(--s2); border-radius: 999px; height: 6px; overflow: hidden; }
    .zbar { height: 100%; border-radius: 999px; transition: width 0.8s cubic-bezier(0.16,1,0.3,1); }
    .zt { font-family: "DM Mono", monospace; font-size: 0.58rem; color: var(--text2); width: 2.5rem; text-align: right; flex-shrink: 0; }
    .erow { display: flex; justify-content: space-between; padding: 0.3rem 0; border-top: 1px solid var(--border); }
    .ename { font-size: 0.78rem; color: var(--text2); }
    .etime { font-family: "DM Mono", monospace; font-size: 0.75rem; color: var(--text); }
    .splits-section { border-top: 1px solid var(--border); padding: 1.1rem 1.25rem; overflow-x: auto; }
    .st { width: 100%; border-collapse: collapse; font-size: 0.78rem; }
    .st th { font-family: "DM Mono", monospace; font-size: 0.52rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-align: right; padding: 0 0.6rem 0.5rem; font-weight: 400; }
    .st th:first-child { text-align: left; }
    .st td { text-align: right; padding: 0.3rem 0.6rem; border-top: 1px solid var(--border); color: var(--text2); font-variant-numeric: tabular-nums; }
    .st td:first-child { text-align: left; color: var(--text); font-family: "DM Mono", monospace; font-size: 0.7rem; }
    .st tr:hover td { background: var(--bg); }

    /* Race banners */
    .race-banner { background: var(--text); border-radius: 1.1rem; padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1.25rem; overflow: hidden; position: relative; margin-bottom: 0.5rem; }
    .race-banner::before { content:""; position:absolute;inset:0;background:radial-gradient(ellipse 50% 100% at 100% 50%,color-mix(in srgb,var(--orange) 18%,transparent),transparent);pointer-events:none; }
    .race-days-num { font-size: 2rem; font-weight: 900; letter-spacing: -0.05em; color: var(--orange); line-height: 1; }
    .race-days-lbl { font-family: "DM Mono", monospace; font-size: 0.5rem; text-transform: uppercase; letter-spacing: 0.1em; color: rgba(255,255,255,0.35); }
    .race-div { width: 1px; height: 40px; background: rgba(255,255,255,0.1); flex-shrink: 0; }
    .race-name { font-size: 1rem; font-weight: 800; letter-spacing: -0.025em; color: #fff; }
    .race-meta { font-family: "DM Mono", monospace; font-size: 0.58rem; color: rgba(255,255,255,0.35); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 0.2rem; }
    .race-prog-bg { flex: 1; background: rgba(255,255,255,0.1); border-radius: 999px; height: 5px; overflow: hidden; max-width: 140px; }
    .race-prog-bar { height: 100%; border-radius: 999px; background: linear-gradient(to right, var(--orange), #ff9a6c); }

    /* ── CHAT PAGE ── */
    .chat-page {
      max-width: 720px; margin: 0 auto;
      display: flex; flex-direction: column;
      height: calc(100vh - var(--hdr));
      padding: 0;
    }
    .chat-msgs { flex: 1; overflow-y: auto; padding: 2rem 1.5rem 1rem; display: flex; flex-direction: column; gap: 0.875rem; }
    .msg { max-width: 82%; animation: mi 0.3s cubic-bezier(0.16,1,0.3,1) both; }
    .msg-u { align-self: flex-end; }
    .msg-a { align-self: flex-start; }
    @keyframes mi { from{opacity:0;transform:translateY(8px) scale(0.97)} to{opacity:1;transform:none} }
    .bubble { padding: 0.75rem 1.05rem; border-radius: 1.1rem; font-size: 0.875rem; line-height: 1.7; }
    .msg-u .bubble { background: var(--text); color: #fff; border-bottom-right-radius: 0.25rem; }
    .msg-a .bubble { background: var(--white); border: 1px solid var(--border); color: var(--text); border-bottom-left-radius: 0.25rem; }
    .msg-think .bubble { color: var(--muted); font-style: italic; font-size: 0.8rem; }
    .msg-think .bubble::after { content:""; animation: dots 1.2s steps(4,end) infinite; }
    @keyframes dots { 0%,20%{content:""} 40%{content:"."} 60%{content:".."} 80%,100%{content:"..."} }
    .chat-foot { padding: 1rem 1.5rem 1.5rem; background: var(--bg); border-top: 1px solid var(--border); flex-shrink: 0; }
    .chat-form { display: flex; gap: 0.5rem; align-items: flex-end; background: var(--white); border: 1px solid var(--border); border-radius: 1rem; padding: 0.5rem 0.5rem 0.5rem 1rem; transition: border-color 0.2s; }
    .chat-form:focus-within { border-color: var(--border2); }
    .chat-in { flex: 1; background: none; border: none; padding: 0.35rem 0; color: var(--text); font-family: "DM Sans", sans-serif; font-size: 0.9rem; outline: none; resize: none; min-height: 28px; max-height: 120px; line-height: 1.5; }
    .chat-in::placeholder { color: var(--muted); }
    .send-btn { width: 36px; height: 36px; flex-shrink: 0; background: var(--text); border: none; border-radius: 0.625rem; color: #fff; font-size: 1rem; font-weight: 900; cursor: pointer; transition: opacity 0.2s, transform 0.1s; display: flex; align-items: center; justify-content: center; }
    .send-btn:hover { opacity: 0.8; }
    .send-btn:active { transform: scale(0.92); }
    .send-btn:disabled { opacity: 0.2; cursor: not-allowed; }
    .chat-hint { font-family: "DM Mono", monospace; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); text-align: center; margin-top: 0.6rem; }
    .new-chat-btn { background: none; border: 1px solid var(--border); border-radius: 999px; padding: 0.25rem 0.75rem; font-family: "DM Mono", monospace; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); cursor: pointer; transition: color 0.2s, border-color 0.2s; }
    .new-chat-btn:hover { color: var(--text); border-color: var(--border2); }

    /* ── MODAL ── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.35); backdrop-filter: blur(4px); z-index: 200; display: none; align-items: center; justify-content: center; padding: 1rem; }
    .modal-overlay.open { display: flex; }
    .modal { background: var(--white); border-radius: 1.5rem; width: 100%; max-width: 580px; max-height: 90vh; overflow-y: auto; box-shadow: 0 24px 80px rgba(0,0,0,0.18); }
    .modal-hdr { display: flex; align-items: center; justify-content: space-between; padding: 1.5rem 1.75rem 1.25rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; background: var(--white); z-index: 1; border-radius: 1.5rem 1.5rem 0 0; }
    .modal-title { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.02em; }
    .modal-close { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--border); background: none; cursor: pointer; font-size: 0.85rem; color: var(--text2); display: flex; align-items: center; justify-content: center; }
    .modal-body { padding: 1.5rem 1.75rem; display: flex; flex-direction: column; gap: 1.75rem; }
    .modal-section-title { font-family: "DM Mono", monospace; font-size: 0.58rem; text-transform: uppercase; letter-spacing: 0.18em; color: var(--muted); margin-bottom: 0.875rem; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.625rem; }
    .form-field { display: flex; flex-direction: column; gap: 0.35rem; }
    .form-field.full { grid-column: 1/-1; }
    .form-label { font-family: "DM Mono", monospace; font-size: 0.55rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--text2); }
    .form-input, .form-select, .form-textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 0.625rem; padding: 0.6rem 0.875rem; font-family: "DM Sans", sans-serif; font-size: 0.875rem; color: var(--text); outline: none; transition: border-color 0.2s; width: 100%; }
    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--orange); }
    .form-textarea { resize: vertical; min-height: 70px; }
    .modal-save { width: 100%; padding: 0.75rem; background: var(--text); color: #fff; border: none; border-radius: 0.875rem; font-family: "DM Sans", sans-serif; font-size: 0.9rem; font-weight: 700; cursor: pointer; transition: opacity 0.2s; }
    .modal-save:hover { opacity: 0.85; }
    .goal-list { display: flex; flex-direction: column; gap: 0.625rem; margin-bottom: 0.625rem; }
    .goal-item { background: var(--bg); border: 1px solid var(--border); border-radius: 0.875rem; padding: 1rem; }
    .goal-item-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; gap: 0.5rem; }
    .goal-remove { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 0.8rem; padding: 0.2rem 0.4rem; border-radius: 0.375rem; }
    .goal-remove:hover { color: #dc2626; background: color-mix(in srgb,#dc2626 8%,transparent); }
    .add-goal-btn { width: 100%; padding: 0.6rem; background: none; border: 1.5px dashed var(--border2); border-radius: 0.75rem; color: var(--text2); font-family: "DM Sans", sans-serif; font-size: 0.875rem; cursor: pointer; transition: border-color 0.2s, color 0.2s; }
    .add-goal-btn:hover { border-color: var(--orange); color: var(--orange); }

    /* ── SKELETON ── */
    .sk { background: linear-gradient(90deg, var(--white) 25%, var(--s2) 50%, var(--white) 75%); background-size: 200% 100%; animation: sh 1.6s infinite; border-radius: 0.875rem; border: 1px solid var(--border); }
    @keyframes sh { 0%{background-position:200% 0} 100%{background-position:-200% 0} }
    .loading { text-align: center; padding: 4rem 2rem; font-family: "DM Mono", monospace; font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); }
  </style>
</head>
<body>

  <header class="hdr" id="hdr">
    <div class="hdr-inner">
      <a class="logo" href="/">
        <div class="logo-icon"><div class="logo-ring"></div><div class="logo-sat"></div><div class="logo-core"></div></div>
        <span class="logo-name">Pacecraft</span>
      </a>
      <nav class="nav">
        <button class="nav-tab on" id="tab-cal" onclick="switchPage('cal')">Calendar</button>
        <button class="nav-tab" id="tab-chat" onclick="switchPage('chat')">Coach</button>
      </nav>
      <div class="hdr-space"></div>
      <div class="user-switch">
        <button class="user-btn on" id="ubtn-a" onclick="switchUser('a')">Willem</button>
        <button class="user-btn" id="ubtn-b" onclick="switchUser('b')">Robert</button>
        <button class="user-btn" id="ubtn-c" onclick="switchUser('c')">Pufe</button>
      </div>
      <div class="hdr-stats">
        <div><div class="hdr-stat-val" id="hdr-week">—</div><div class="hdr-stat-lbl">This week</div></div>
        <div class="hdr-sep"></div>
        <div><div class="hdr-stat-val" id="hdr-ytd">—</div><div class="hdr-stat-lbl">YTD</div></div>
      </div>
      <div class="hdr-sep" style="margin-left:0.5rem"></div>
      <div class="hdr-avatar" id="hdr-av">W</div>
      <button class="settings-btn" onclick="openSettings()" title="Profile & Goals">⚙</button>
    </div>
  </header>

  <!-- CALENDAR PAGE -->
  <div class="page on" id="page-cal">
    <!-- Latest activity hero -->
    <div class="latest-hero">
      <div class="latest-label">Latest activity</div>
      <div id="latest-card"><div class="sk" style="height:200px;border-radius:1.5rem"></div></div>
    </div>

    <div class="cal-page">
      <div id="race-banners"></div>
      <div class="cal-nav">
        <div class="cal-month-label" id="cal-month-label">—</div>
        <div class="cal-nav-btns">
          <button class="cal-btn" onclick="changeMonth(-1)">‹</button>
          <button class="cal-btn" onclick="changeMonth(1)">›</button>
        </div>
      </div>
      <div class="cal-weekdays">
        <div class="cal-wd">Mon</div><div class="cal-wd">Tue</div><div class="cal-wd">Wed</div>
        <div class="cal-wd">Thu</div><div class="cal-wd">Fri</div><div class="cal-wd">Sat</div><div class="cal-wd">Sun</div>
      </div>
      <div class="cal-grid" id="cal-grid"><div class="loading">Loading activities...</div></div>
    </div>
  </div>

  <!-- CHAT PAGE -->
  <div class="page" id="page-chat">
    <div class="chat-page">
      <div class="chat-msgs" id="chat-msgs"></div>
      <div class="chat-foot">
        <form class="chat-form" id="chat-form">
          <textarea class="chat-in" id="chat-in" placeholder="Ask your coach anything..." rows="1"></textarea>
          <button class="send-btn" id="send-btn" type="submit">↑</button>
        </form>
        <div class="chat-hint">
          <button class="new-chat-btn" onclick="clearChat()">New conversation</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay" id="modal-overlay" onclick="handleOverlayClick(event)">
    <div class="modal">
      <div class="modal-hdr">
        <div class="modal-title">Profile &amp; Goals</div>
        <button class="modal-close" onclick="closeSettings()">✕</button>
      </div>
      <div class="modal-body">
        <div>
          <div class="modal-section-title">Athlete profile</div>
          <p style="font-family:'DM Mono',monospace;font-size:0.58rem;color:var(--muted);margin-bottom:0.875rem">Gender and weight sync automatically from Strava.</p>
          <div class="form-grid">
            <div class="form-field"><label class="form-label">Height (cm)</label><input class="form-input" id="p-height" type="number" placeholder="175"/></div>
            <div class="form-field"><label class="form-label">Age</label><input class="form-input" id="p-age" type="number" placeholder="30"/></div>
            <div class="form-field"><label class="form-label">Max HR (bpm)</label><input class="form-input" id="p-maxhr" type="number" placeholder="190"/></div>
            <div class="form-field"><label class="form-label">Resting HR (bpm)</label><input class="form-input" id="p-resthr" type="number" placeholder="50"/></div>
            <div class="form-field full"><label class="form-label">Notes for the coach</label><textarea class="form-textarea" id="p-notes" placeholder="E.g. recovering from knee injury, training 5x/week, prefer morning runs..."></textarea></div>
          </div>
        </div>
        <div>
          <div class="modal-section-title">Race goals</div>
          <div class="goal-list" id="goal-list"></div>
          <button class="add-goal-btn" onclick="addGoalForm()">+ Add race goal</button>
        </div>
        <button class="modal-save" onclick="saveSettings()">Save</button>
      </div>
    </div>
  </div>

  <script>
    // ── Active user ──
    let activeUser = "a";
    function switchUser(u) {
      activeUser = u;
      document.getElementById("ubtn-a").classList.toggle("on", u === "a");
      document.getElementById("ubtn-b").classList.toggle("on", u === "b");
      document.getElementById("ubtn-c").classList.toggle("on", u === "c");
      zonesCache = null;
      // Clear chat UI — each user has their own conversation
      chatMsgs = [];
      msgsEl().innerHTML = "";
      loadAll();
    }

    // ── Utils ──
    const dur = s=>{const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sc=s%60;return h?`${h}:${String(m).padStart(2,"0")}:${String(sc).padStart(2,"0")}`:`${m}:${String(sc).padStart(2,"0")}`;};
    const pace = mps=>{if(!mps)return"—";const spk=1000/mps,m=Math.floor(spk/60),s=Math.round(spk%60);return`${m}:${String(s).padStart(2,"0")}`;};
    const actCol = t=>{if(!t)return"#7c3aed";if(t.includes("Run"))return"#ff5500";if(t.includes("Ride"))return"#0088cc";if(t==="Swim")return"#16a34a";return"#7c3aed";};
    const actBg  = t=>{if(!t)return"#f3f0ff";if(t.includes("Run"))return"#fff3ee";if(t.includes("Ride"))return"#eff8ff";if(t==="Swim")return"#effff8";return"#f3f0ff";};

    // ── Polyline ──
    function decode(enc){const c=[];let i=0,la=0,ln=0;while(i<enc.length){let b,s=0,r=0;do{b=enc.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);la+=(r&1)?~(r>>1):(r>>1);s=0;r=0;do{b=enc.charCodeAt(i++)-63;r|=(b&0x1f)<<s;s+=5;}while(b>=0x20);ln+=(r&1)?~(r>>1):(r>>1);c.push([la/1e5,ln/1e5]);}return c;}
    function makeSVG(enc,W,H,pad,sw,col){
      const c=decode(enc);if(c.length<2)return null;
      const las=c.map(x=>x[0]),lns=c.map(x=>x[1]);
      const mla=Math.min(...las),xla=Math.max(...las),mln=Math.min(...lns),xln=Math.max(...lns);
      const sx=(xln-mln)||1,sy=(xla-mla)||1,sc=Math.min((W-pad*2)/sx,(H-pad*2)/sy);
      const ox=(W-sc*sx)/2,oy=(H-sc*sy)/2;
      const pts=c.map(([a,n])=>`${ox+(n-mln)*sc},${H-oy-(a-mla)*sc}`).join(" ");
      const [x0,y0]=pts.split(" ")[0].split(",");
      const id="g"+Math.random().toString(36).slice(2,6);
      return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
        <defs><filter id="${id}"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
        <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" filter="url(#${id})" opacity="0.85"/>
        <circle cx="${x0}" cy="${y0}" r="5" fill="${col}"/>
        <circle cx="${x0}" cy="${y0}" r="10" fill="${col}" opacity="0.15"/>
      </svg>`;
    }

    // ── Page switcher ──
    function switchPage(name) {
      document.querySelectorAll(".page").forEach(p=>p.classList.remove("on"));
      document.querySelectorAll(".nav-tab").forEach(t=>t.classList.remove("on"));
      document.getElementById(`page-${name}`).classList.add("on");
      document.getElementById(`tab-${name}`).classList.add("on");
      window.scrollTo(0,0);
    }

    // ── Latest activity hero ──
    function renderLatestHero(a) {
      const isRun = a.sport_type?.includes("Run");
      const col = actCol(a.sport_type);
      const date = new Date(a.start_date_local).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
      const poly = a.map?.summary_polyline;
      const svg = poly ? makeSVG(poly, 320, 200, 20, 2.5, col) : null;
      document.getElementById("latest-card").innerHTML = `
        <div class="latest-card">
          <div class="latest-body">
            <div>
              <div class="latest-type">${a.sport_type} · ${date}</div>
              <div class="latest-name">${a.name}</div>
            </div>
            <div class="latest-stats">
              <div>
                <div class="lstat-val accent">${(a.distance/1000).toFixed(2)}<span class="lstat-unit">km</span></div>
                <div class="lstat-lbl">Distance</div>
              </div>
              <div>
                <div class="lstat-val">${isRun ? pace(a.average_speed) : (a.average_speed*3.6).toFixed(1)}<span class="lstat-unit">${isRun ? "/km" : "km/h"}</span></div>
                <div class="lstat-lbl">${isRun ? "Pace" : "Speed"}</div>
              </div>
              <div>
                <div class="lstat-val">${a.average_heartrate ? Math.round(a.average_heartrate) : "—"}<span class="lstat-unit">${a.average_heartrate ? "bpm" : ""}</span></div>
                <div class="lstat-lbl">Avg HR</div>
              </div>
              <div>
                <div class="lstat-val">${dur(a.moving_time)}</div>
                <div class="lstat-lbl">Duration</div>
              </div>
              <div>
                <div class="lstat-val">${Math.round(a.total_elevation_gain)}<span class="lstat-unit">m</span></div>
                <div class="lstat-lbl">Elevation</div>
              </div>
            </div>
          </div>
          ${svg ? `<div class="latest-map">${svg}</div>` : ""}
        </div>`;
    }

    // ── Calendar state ──
    let allActs = [], actsByDate = {}, viewYear, viewMonth, selectedDay = null;

    function indexActivities(acts) {
      actsByDate = {};
      acts.forEach(a => {
        const d = a.start_date_local?.slice(0,10);
        if (!d) return;
        if (!actsByDate[d]) actsByDate[d] = [];
        actsByDate[d].push(a);
      });
    }

    function changeMonth(dir) {
      viewMonth += dir;
      if (viewMonth > 11) { viewMonth = 0; viewYear++; }
      if (viewMonth < 0)  { viewMonth = 11; viewYear--; }
      selectedDay = null;
      renderCalendar();
    }

    function renderCalendar() {
      const months = ["January","February","March","April","May","June","July","August","September","October","November","December"];
      document.getElementById("cal-month-label").textContent = `${months[viewMonth]} ${viewYear}`;

      const today = new Date(); today.setHours(0,0,0,0);
      const firstDay = new Date(viewYear, viewMonth, 1);
      const lastDay  = new Date(viewYear, viewMonth+1, 0);
      // Mon=0 offset
      let startOffset = (firstDay.getDay() + 6) % 7;

      const grid = document.getElementById("cal-grid");
      let html = "";

      // Empty cells before first day
      for (let i = 0; i < startOffset; i++) html += `<div class="cal-day empty"></div>`;

      for (let d = 1; d <= lastDay.getDate(); d++) {
        const dateStr = `${viewYear}-${String(viewMonth+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
        const acts = actsByDate[dateStr] || [];
        const isToday = new Date(viewYear,viewMonth,d).getTime() === today.getTime();
        const isSel = selectedDay === dateStr;
        const cls = ["cal-day", acts.length?"has-act":"", isToday?"is-today":"", isSel?"selected":""].filter(Boolean).join(" ");
        const chipsHTML = acts.slice(0,2).map(a=>`
          <div class="cal-act-chip" style="background:${actBg(a.sport_type)};color:${actCol(a.sport_type)}">
            <div class="cal-act-dot" style="background:${actCol(a.sport_type)}"></div>
            <span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60px">${a.name}</span>
            <span class="cal-act-km">${(a.distance/1000).toFixed(1)}</span>
          </div>`).join("");
        const extra = acts.length > 2 ? `<div style="font-family:'DM Mono',monospace;font-size:0.5rem;color:var(--muted);margin-top:0.2rem">+${acts.length-2} more</div>` : "";
        const onclick = acts.length ? `onclick="toggleDay('${dateStr}')"` : "";
        html += `<div class="${cls}" ${onclick}>
          <div class="cal-day-num">${d}</div>
          <div class="cal-day-acts">${chipsHTML}${extra}</div>
        </div>`;

        // Insert detail drawer after the row containing the selected day
        if (isSel) {
          // Insert as full-width row at end of current row
          html += `<div class="detail-drawer open" id="detail-drawer" style="grid-column:1/-1"></div>`;
        }

        // If this is the last day and no selected drawer yet, close the grid properly
      }

      // If selected day was not in this month, clear drawer
      grid.innerHTML = html;

      if (selectedDay && actsByDate[selectedDay]) {
        loadDrawer(actsByDate[selectedDay][0]);
      }
    }

    function toggleDay(dateStr) {
      if (selectedDay === dateStr) {
        selectedDay = null;
      } else {
        selectedDay = dateStr;
      }
      renderCalendar();
    }

    let zonesCache = null;
    async function getZones(){if(zonesCache)return zonesCache;const r=await fetch(`/api/zones?user=${activeUser}`);zonesCache=r.ok?await r.json():null;return zonesCache;}
    function calcZT(hr,t,zones){const th=zones?.heart_rate?.zones?.map(z=>z.min)??[];if(!th.length||!hr?.length)return null;const tot=new Array(th.length).fill(0);for(let i=1;i<hr.length;i++){const v=hr[i],dt=t[i]-t[i-1];let z=0;for(let x=th.length-1;x>=0;x--){if(v>=th[x]){z=x;break;}}tot[z]+=dt;}return tot;}
    const ZC=["var(--z1)","var(--z2)","var(--z3)","var(--z4)","var(--z5)"];

    async function loadDrawer(a) {
      const el = document.getElementById("detail-drawer");
      if (!el) return;
      el.innerHTML = `<div style="padding:2rem;text-align:center;color:var(--muted);font-family:'DM Mono',monospace;font-size:0.7rem;letter-spacing:0.1em">Loading...</div>`;

      const [aR,sR,zones] = await Promise.all([
        fetch(`/api/activity?id=${a.id}&user=${activeUser}`),
        fetch(`/api/streams?id=${a.id}&user=${activeUser}`),
        getZones(),
      ]);
      const act = aR.ok ? await aR.json() : a;
      const streams = sR.ok ? await sR.json() : null;
      const col = actCol(act.sport_type);
      const poly = act?.map?.polyline || act?.map?.summary_polyline;
      const svg = poly ? makeSVG(poly,900,220,24,2.5,col) : null;
      const mapH = svg ? `<div class="drawer-map">${svg}</div>` : "";
      const isRun = act.sport_type?.includes("Run");
      const hr=streams?.heartrate?.data,t=streams?.time?.data;
      const zt=calcZT(hr,t,zones),ztot=zt?zt.reduce((a,b)=>a+b,0):0;
      const zonesH=zt?`<div class="dcol"><div class="dlbl">HR Zones</div>${zt.map((v,i)=>`<div class="zrow"><span class="zname">Z${i+1}</span><div class="zbg"><div class="zbar" style="width:${ztot?(v/ztot*100).toFixed(1):0}%;background:${ZC[i]}"></div></div><span class="zt">${dur(v)}</span></div>`).join("")}</div>`:`<div class="dcol"><div class="dlbl">HR Zones</div><span style="color:var(--muted);font-size:0.8rem">No HR data</span></div>`;
      const efs=act?.best_efforts?.slice(0,6)??[];
      const efsH=`<div class="dcol"><div class="dlbl">Best efforts</div>${efs.map(e=>`<div class="erow"><span class="ename">${e.name}</span><span class="etime">${dur(e.elapsed_time)}</span></div>`).join("")||`<span style="color:var(--muted);font-size:0.8rem">—</span>`}</div>`;
      const splits=act?.splits_metric??[];
      const splH=splits.length?`<div class="splits-section"><div class="dlbl" style="margin-bottom:0.5rem">Km splits</div><table class="st"><thead><tr><th>km</th><th>${isRun?"Pace":"Speed"}</th><th>HR</th><th>Cad</th><th>Elev</th></tr></thead><tbody>${splits.map((s,i)=>`<tr><td>${i+1}</td><td>${isRun?pace(s.average_speed):(s.average_speed*3.6).toFixed(1)}</td><td>${s.average_heartrate?Math.round(s.average_heartrate):"—"}</td><td>${s.average_cadence?Math.round(s.average_cadence*2):"—"}</td><td>${s.elevation_difference>=0?"+":""}${Math.round(s.elevation_difference)}m</td></tr>`).join("")}</tbody></table></div>`:"";
      const date = new Date(act.start_date_local).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});

      el.innerHTML = `
        ${mapH}
        <div class="drawer-header">
          <div>
            <div class="drawer-title">${act.name}</div>
            <div class="drawer-meta">${act.sport_type} · ${date}</div>
          </div>
          <button class="drawer-close" onclick="toggleDay('${selectedDay}')">✕</button>
        </div>
        <div class="drawer-stats">
          <div class="dstat"><div class="dstat-lbl">Distance</div><div class="dstat-val" style="color:${col}">${(act.distance/1000).toFixed(2)}<span class="dstat-unit">km</span></div></div>
          <div class="dstat"><div class="dstat-lbl">${isRun?"Pace":"Speed"}</div><div class="dstat-val">${isRun?pace(act.average_speed):(act.average_speed*3.6).toFixed(1)}<span class="dstat-unit">${isRun?"/km":"km/h"}</span></div></div>
          <div class="dstat"><div class="dstat-lbl">Avg HR</div><div class="dstat-val">${act.average_heartrate?Math.round(act.average_heartrate):"—"}<span class="dstat-unit">${act.average_heartrate?"bpm":""}</span></div></div>
          <div class="dstat"><div class="dstat-lbl">Duration</div><div class="dstat-val" style="font-size:1.1rem">${dur(act.moving_time)}</div></div>
        </div>
        <div class="drawer-body">${zonesH}${efsH}</div>
        ${splH}`;

      // scroll drawer into view
      setTimeout(()=>el.scrollIntoView({behavior:"smooth",block:"nearest"}),100);
    }

    // ── Chat ──
    let chatMsgs = [], chatCtx = null;
    const msgsEl = () => document.getElementById("chat-msgs");

    const chatKey = () => `pacecraft_chat_${activeUser}`;
    function saveChat() { localStorage.setItem(chatKey(), JSON.stringify(chatMsgs.slice(-40))); }
    function loadChatHistory() { try { return JSON.parse(localStorage.getItem(chatKey()))||[]; } catch { return []; } }

    function addMsg(role,text){
      const c=msgsEl(),d=document.createElement("div");
      d.className=`msg msg-${role}`;
      d.innerHTML=`<div class="bubble">${text.replace(/\n/g,"<br>")}</div>`;
      c.appendChild(d);c.scrollTop=c.scrollHeight;return d;
    }
    function addThink(){const c=msgsEl(),d=document.createElement("div");d.className="msg msg-a msg-think";d.innerHTML=`<div class="bubble">Analysing</div>`;c.appendChild(d);c.scrollTop=c.scrollHeight;return d;}

    async function sendMsg(text){
      const btn=document.getElementById("send-btn"),inp=document.getElementById("chat-in");
      btn.disabled=true;
      if(text){chatMsgs.push({role:"user",parts:[{text}]});addMsg("u",text);}
      const th=addThink();
      try{
        const r=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({messages:chatMsgs,context:chatCtx})});
        const d=await r.json(),reply=d.reply??d.error??"Something went wrong.";
        th.remove();addMsg("a",reply);chatMsgs.push({role:"model",parts:[{text:reply}]});saveChat();
      }catch{th.remove();addMsg("a","Something went wrong.");}
      btn.disabled=false;inp.value="";inp.style.height="auto";
    }

    function clearChat(){
      localStorage.removeItem(CHAT_KEY);chatMsgs=[];msgsEl().innerHTML="";
      chatMsgs.push({role:"user",parts:[{text:"Analysis of past activity"}]});
      sendMsg(null);
    }

    // ── Settings ──
    const STORAGE_KEY = "pacecraft_settings";
    function loadSettings(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||{profile:{},goals:[]};}catch{return{profile:{},goals:[]};}}

    function saveSettings(){
      const s=loadSettings();
      const p={...s.profile,height:document.getElementById("p-height").value,age:document.getElementById("p-age").value,maxHR:document.getElementById("p-maxhr").value,restHR:document.getElementById("p-resthr").value,notes:document.getElementById("p-notes").value};
      const goals=Array.from(document.querySelectorAll(".goal-form")).map(f=>({id:f.dataset.id,name:f.querySelector(".g-name").value,date:f.querySelector(".g-date").value,dist:f.querySelector(".g-dist").value,target:f.querySelector(".g-target").value,type:f.querySelector(".g-type").value,notes:f.querySelector(".g-notes").value})).filter(g=>g.name&&g.date);
      localStorage.setItem(STORAGE_KEY,JSON.stringify({profile:p,goals}));
      closeSettings();renderRaceBanners();
    }
    function openSettings(){
      const s=loadSettings(),p=s.profile||{};
      document.getElementById("p-height").value=p.height||"";
      document.getElementById("p-age").value=p.age||"";
      document.getElementById("p-maxhr").value=p.maxHR||"";
      document.getElementById("p-resthr").value=p.restHR||"";
      document.getElementById("p-notes").value=p.notes||"";
      const list=document.getElementById("goal-list");list.innerHTML="";
      (s.goals||[]).forEach(g=>renderGoalForm(g));
      document.getElementById("modal-overlay").classList.add("open");
    }
    function closeSettings(){document.getElementById("modal-overlay").classList.remove("open");}
    function handleOverlayClick(e){if(e.target===document.getElementById("modal-overlay"))closeSettings();}
    function addGoalForm(){renderGoalForm({id:Date.now().toString()});}
    function renderGoalForm(g){
      const div=document.createElement("div");div.className="goal-item goal-form";div.dataset.id=g.id||Date.now().toString();
      div.innerHTML=`<div class="goal-item-hdr"><input class="form-input g-name" placeholder="Race name" value="${g.name||""}" style="font-weight:700"/><button class="goal-remove" onclick="this.closest('.goal-form').remove()">Remove</button></div>
        <div class="form-grid">
          <div class="form-field"><label class="form-label">Race date</label><input class="form-input g-date" type="date" value="${g.date||""}"/></div>
          <div class="form-field"><label class="form-label">Distance (km)</label><input class="form-input g-dist" type="number" placeholder="42.2" value="${g.dist||""}"/></div>
          <div class="form-field"><label class="form-label">Target time or pace</label><input class="form-input g-target" placeholder="3:30:00 or 4:58/km" value="${g.target||""}"/></div>
          <div class="form-field"><label class="form-label">Type</label><select class="form-select g-type"><option value="road" ${g.type==="road"?"selected":""}>Road</option><option value="trail" ${g.type==="trail"?"selected":""}>Trail</option><option value="mountain" ${g.type==="mountain"?"selected":""}>Mountain</option><option value="track" ${g.type==="track"?"selected":""}>Track</option></select></div>
          <div class="form-field full"><label class="form-label">Notes</label><textarea class="form-textarea g-notes" placeholder="Terrain, elevation, strategy...">${g.notes||""}</textarea></div>
        </div>`;
      document.getElementById("goal-list").appendChild(div);
    }

    function renderRaceBanners(){
      const s=loadSettings(),goals=(s.goals||[]).filter(g=>g.date&&new Date(g.date)>new Date());
      const el=document.getElementById("race-banners");
      if(!goals.length){el.innerHTML="";return;}
      goals.sort((a,b)=>new Date(a.date)-new Date(b.date));
      el.style.marginBottom="1.25rem";
      el.innerHTML=goals.map(g=>{
        const days=Math.ceil((new Date(g.date)-new Date())/864e5);
        const prog=Math.max(0,Math.min(100,100-(days/180*100)));
        return`<div class="race-banner">
          <div><div class="race-days-num">${days}</div><div class="race-days-lbl">days</div></div>
          <div class="race-div"></div>
          <div style="flex:1"><div class="race-name">${g.name}</div><div class="race-meta">${g.dist?g.dist+"km · ":""}${new Date(g.date).toLocaleDateString("en-GB",{day:"numeric",month:"long"})}${g.target?" · "+g.target:""}</div></div>
          <div class="race-prog-bg"><div class="race-prog-bar" style="width:${prog}%"></div></div>
        </div>`;
      }).join("");
    }

    // ── Boot ──
    window.addEventListener("scroll",()=>document.getElementById("hdr").classList.toggle("raised",window.scrollY>10),{passive:true});
    document.getElementById("chat-form").addEventListener("submit",e=>{e.preventDefault();const v=document.getElementById("chat-in").value.trim();if(v)sendMsg(v);});
    document.getElementById("chat-in").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();document.getElementById("chat-form").dispatchEvent(new Event("submit"));}});

    function loadAll() {
      document.getElementById("latest-card").innerHTML = `<div class="sk" style="height:200px;border-radius:1.5rem"></div>`;
      document.getElementById("cal-grid").innerHTML = `<div class="loading">Loading...</div>`;

      Promise.all([
        fetch(`/api/activities?user=${activeUser}&per_page=60`).then(r=>r.json()),
        fetch(`/api/stats?user=${activeUser}`).then(r=>r.ok?r.json():null),
      ]).then(([acts,athlete])=>{
        if(!Array.isArray(acts))return;
        allActs=acts;

        if(athlete){
          const s=loadSettings();s.profile=s.profile||{};
          if(athlete.weight)s.profile.weight=athlete.weight;
          if(athlete.sex)s.profile.gender=athlete.sex==="M"?"male":"female";
          localStorage.setItem(STORAGE_KEY,JSON.stringify(s));
          document.getElementById("hdr-av").textContent=(athlete.firstname?.[0]||"")+(athlete.lastname?.[0]||"");
        }

        const now=new Date(),weekAgo=new Date(now-7*864e5);
        const wkKm=acts.filter(a=>new Date(a.start_date_local)>=weekAgo).reduce((s,a)=>s+a.distance/1000,0);
        document.getElementById("hdr-week").textContent=wkKm.toFixed(1)+" km";
        if(athlete?.stats){
          document.getElementById("hdr-ytd").textContent=((athlete.stats.ytd_run_totals?.distance||0)/1000).toFixed(0)+" km";
        }

        if(acts[0]) renderLatestHero(acts[0]);
        indexActivities(acts);
        selectedDay=null;
        const now2=new Date();viewYear=now2.getFullYear();viewMonth=now2.getMonth();
        renderCalendar();
        renderRaceBanners();

        const s=loadSettings(),r10=acts.slice(0,10);
        const wl={};acts.forEach(a=>{if(!a.start_date_local)return;const d=new Date(a.start_date_local),day=d.getDay(),mon=new Date(d);mon.setDate(d.getDate()-((day+6)%7));const k=mon.toISOString().slice(0,10);if(!wl[k])wl[k]={week:k,km:0,time:0,count:0};wl[k].km+=a.distance/1000;wl[k].time+=a.moving_time;wl[k].count++;});
        const weeklyLoad=Object.values(wl).sort((a,b)=>b.week.localeCompare(a.week)).slice(0,4);

        const lid=acts[0]?.id;
        Promise.all([
          lid?fetch(`/api/activity?id=${lid}&user=${activeUser}`).then(r=>r.ok?r.json():null):Promise.resolve(null),
          lid?fetch(`/api/streams?id=${lid}&user=${activeUser}`).then(r=>r.ok?r.json():null):Promise.resolve(null),
        ]).then(([la,ls])=>{
          chatCtx={athlete,latestActivity:la,latestStreams:ls,recentActivities:r10,weeklyLoad,profile:s.profile,goals:s.goals};
          // Restore this user's chat history or start fresh
          if(!chatMsgs.length){
            const hist=loadChatHistory();
            if(hist.length){chatMsgs=hist;hist.forEach(m=>addMsg(m.role==="user"?"u":"a",m.parts[0].text));}
            else{chatMsgs.push({role:"user",parts:[{text:"Analysis of past activity"}]});sendMsg(null);}
          }
        });
      });
    }

    loadAll();
  </script>
</body>
</html>
