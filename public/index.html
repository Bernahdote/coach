<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Coach — Träningsdashboard</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0a;
      --surface: #111111;
      --border: #222222;
      --text: #f0f0f0;
      --muted: #666666;
      --accent: #e85d26;
      --run: #e85d26;
      --ride: #3b82f6;
      --swim: #06b6d4;
      --other: #8b5cf6;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      min-height: 100vh;
      padding: 2rem 1rem;
    }

    header {
      max-width: 900px;
      margin: 0 auto 3rem;
    }

    header h1 {
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    header p {
      color: var(--muted);
      margin-top: 0.4rem;
      font-size: 0.9rem;
    }

    #grid {
      max-width: 900px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
      gap: 1rem;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1rem;
      padding: 1.25rem 1.5rem;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .card-meta {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .card-name {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .badge {
      font-size: 0.7rem;
      font-weight: 600;
      padding: 0.3rem 0.7rem;
      border-radius: 999px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    .badge-Run    { background: color-mix(in srgb, var(--run) 15%, transparent); color: var(--run); }
    .badge-Ride   { background: color-mix(in srgb, var(--ride) 15%, transparent); color: var(--ride); }
    .badge-Swim   { background: color-mix(in srgb, var(--swim) 15%, transparent); color: var(--swim); }
    .badge-Other  { background: color-mix(in srgb, var(--other) 15%, transparent); color: var(--other); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.75rem;
      margin-top: 1.25rem;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      font-variant-numeric: tabular-nums;
    }

    .stat-unit {
      font-size: 0.65rem;
      color: var(--muted);
      margin-left: 0.2rem;
    }

    .skeleton {
      background: linear-gradient(90deg, var(--surface) 25%, var(--border) 50%, var(--surface) 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 1rem;
      height: 140px;
    }

    @keyframes shimmer {
      0%   { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }

    .error {
      max-width: 900px;
      margin: 0 auto;
      padding: 1rem 1.25rem;
      background: color-mix(in srgb, #ef4444 10%, transparent);
      border: 1px solid color-mix(in srgb, #ef4444 30%, transparent);
      border-radius: 0.75rem;
      color: #ef4444;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Träningsdashboard</h1>
    <p>Live-data från Strava</p>
  </header>

  <div id="grid"></div>

  <script>
    const API = "/api/activities?user=a&per_page=30";
    const grid = document.getElementById("grid");

    function formatDuration(s) {
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const sec = s % 60;
      if (h > 0) return `${h}:${String(m).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;
      return `${m}:${String(sec).padStart(2,"0")}`;
    }

    function formatPace(mps) {
      if (!mps) return "—";
      const spk = 1000 / mps;
      const m = Math.floor(spk / 60);
      const s = Math.round(spk % 60);
      return `${m}:${String(s).padStart(2,"0")}`;
    }

    function badgeClass(type) {
      if (["Run","TrailRun","VirtualRun"].includes(type)) return "badge-Run";
      if (["Ride","VirtualRide","MountainBikeRide","GravelRide"].includes(type)) return "badge-Ride";
      if (type === "Swim") return "badge-Swim";
      return "badge-Other";
    }

    function renderCard(a) {
      const km = (a.distance / 1000).toFixed(2);
      const date = new Date(a.start_date_local);
      const dateStr = date.toLocaleDateString("sv-SE", { weekday:"short", day:"numeric", month:"short" });
      const isRun = a.sport_type?.includes("Run");

      return `
        <div class="card">
          <div class="card-top">
            <div style="min-width:0">
              <div class="card-meta">${a.sport_type} · ${dateStr}</div>
              <div class="card-name">${a.name}</div>
            </div>
            <span class="badge ${badgeClass(a.sport_type)}">${km} km</span>
          </div>
          <div class="stats">
            <div>
              <div class="stat-label">Tid</div>
              <div class="stat-value">${formatDuration(a.moving_time)}</div>
            </div>
            <div>
              <div class="stat-label">${isRun ? "Tempo" : "Fart"}</div>
              <div class="stat-value">${isRun ? formatPace(a.average_speed) : (a.average_speed * 3.6).toFixed(1)}<span class="stat-unit">${isRun ? "/km" : "km/h"}</span></div>
            </div>
            <div>
              <div class="stat-label">Puls</div>
              <div class="stat-value">${a.average_heartrate ? Math.round(a.average_heartrate) : "—"}<span class="stat-unit">${a.average_heartrate ? "bpm" : ""}</span></div>
            </div>
            <div>
              <div class="stat-label">Höjd</div>
              <div class="stat-value">${Math.round(a.total_elevation_gain)}<span class="stat-unit">m</span></div>
            </div>
          </div>
        </div>`;
    }

    // show skeletons while loading
    grid.innerHTML = Array.from({length: 6}, () => `<div class="skeleton"></div>`).join("");

    fetch(API)
      .then(r => { if (!r.ok) throw new Error(`HTTP ${r.status}`); return r.json(); })
      .then(activities => {
        if (!activities.length) {
          grid.innerHTML = `<p style="color:var(--muted)">Inga aktiviteter.</p>`;
          return;
        }
        grid.innerHTML = activities.map(renderCard).join("");
      })
      .catch(err => {
        grid.innerHTML = `<div class="error">Kunde inte hämta aktiviteter: ${err.message}</div>`;
      });
  </script>
</body>
</html>
